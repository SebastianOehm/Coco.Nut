name: Build

on:
  push:
  pull_request:

env:
  AVALONIA_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

permissions:
  contents: read

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: warn

  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Base version from Directory.Build.props (<Version>). Pushes to preMain get a unique pre-release suffix;
      # a v* tag uses the tag's version; everything else uses the base version.
      - name: Compute version
        id: version
        shell: bash
        run: |
          base=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          prerelease=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            [[ "$version" == *-* ]] && prerelease=true
          elif [[ "$GITHUB_REF" == refs/heads/preMain ]]; then
            version="${base}-pre.${GITHUB_RUN_NUMBER}"
            prerelease=true
          else
            version="$base"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Version: $version (pre-release: $prerelease)"

  publish:
    name: Publish (${{ matrix.rid }})
    needs: [build, version]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preMain' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
          - rid: linux-x64
          - rid: osx-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Publish ${{ matrix.rid }}
        run: >-
          dotnet publish src/CocoNut.App -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true
          -p:Version=${{ needs.version.outputs.version }}
          -o publish/${{ matrix.rid }}

      - name: Upload ${{ matrix.rid }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: CocoNut-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}

  prerelease:
    name: GitHub pre-release
    needs: [publish, version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/preMain'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package archives
        shell: bash
        run: |
          mkdir -p release
          for dir in artifacts/CocoNut-*; do
            name=$(basename "$dir")
            (cd "$dir" && zip -qr "../../release/${name}-${{ needs.version.outputs.version }}.zip" .)
          done
          ls -l release

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          gh release create "v${VERSION}" release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Coco.Nut ${VERSION}" \
            --notes "Automatic pre-release built from preMain at ${GITHUB_SHA}. Not for production use: test with COCONUT_DRY_RUN=1 first." \
            --generate-notes
